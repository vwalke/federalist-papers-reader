name = "publius-post"
main = "src/index.ts"
compatibility_date = "2026-07-01"
workers_dev = false
preview_urls = false
keep_vars = true

routes = [
  { pattern = "federalistreader.org/api/*", zone_name = "federalistreader.org" },
  # Wildcard, not exact: exact routes fail to match when a query string is
  # present, and every emailed manage link carries ?token=...
  { pattern = "federalistreader.org/manage*", zone_name = "federalistreader.org" },
  # Cloudflare Access must protect /post-office* before this route is deployed.
  { pattern = "federalistreader.org/post-office*", zone_name = "federalistreader.org" }
]

[triggers]
# The daily run goes out at 7am Eastern. Crons are UTC, so fire at 11:00 UTC
# (7am EDT) and 12:00 UTC (7am EST); src/index.ts runs only the one that is
# 7am in New York and the other returns without doing anything.
crons = ["0 11 * * *", "0 12 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "publius-post"
database_id = "3aaf5f2e-30d5-4a67-aa57-ad0dcd0a63b6"

# Secrets (set with `wrangler secret put`, never committed): RESEND_API_KEY,
# TOKEN_SECRET, POSTAL_ADDRESS, RESEND_WEBHOOK_SECRET, TURNSTILE_SECRET,
# CLOUDFLARE_ANALYTICS_TOKEN. TURNSTILE_SECRET is required: without it every
# signup is refused. Signup rate limits live in D1 (migration 0009), so no
# extra binding is needed. See docs/deployment.md, "Signup protection".

[vars]
SITE_URL = "https://federalistreader.org"
FROM_ADDRESS = "Publius — The Federalist <publius@federalistreader.org>"
